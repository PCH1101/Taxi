# =============================================================================
# Trino Delta Lake Catalog Configuration (Trino 465+)
# Connects Trino directly to MinIO Object Storage for Delta Lake tables.
# =============================================================================
connector.name=delta_lake

# ── Metastore Configuration (File-based stored in MinIO S3) ───────────────────
hive.metastore=file
hive.metastore.catalog.dir=s3://gold/trino-metastore

# ── MinIO / S3 Connection ────────────────────────────────────────────────────
fs.native-s3.enabled=true
s3.exclusive-create=false
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=pipeline-access-key
s3.aws-secret-key=pipeline-secret-key-change-me

# ── Procedures & Writes ───────────────────────────────────────────────────────
delta.register-table-procedure.enabled=true
delta.enable-non-concurrent-writes=true

